[project]
name = "phoenixrpa"
version = "0.1.0"
description = "Self-Healing Agentic RPA Framework powered by Playwright, Selenium, FastAPI, PostgreSQL and LLMs."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Charish Yadav", email = "charish7968@gmail.com" }
]

dependencies = [
    "alembic>=1.19.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "playwright>=1.62.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
